    <animate attributeName="x" values="96;96;394;394;96" keyTimes="0;0.12;0.45;0.89;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="68" width="1100" height="2" fill="#087f9c" opacity="0">
    <animate attributeName="y" values="68;327;68" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.12;0" dur="8s" repeatCount="indefinite"/>
  </rect>
