  <text x="743" y="324" fill="#536b88" font-family="Consolas,Cascadia Code,monospace" font-size="14">IDENTITY SIGNAL / AO-001</text>

  <rect x="34" y="331" width="489" height="45" rx="8" fill="#ffffff" stroke="#9cb8d2" stroke-width="2"/>
  <text x="52" y="360" fill="#087f9c" font-family="Consolas,Cascadia Code,monospace" font-size="20">$</text>
  <text x="94" y="360" fill="#14223e" font-family="Consolas,Cascadia Code,monospace" font-size="20" clip-path="url(#command-clip)">whoami → Amir Oveissi</text>
  <rect x="96" y="344" width="10" height="20" fill="#087f9c">
