<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">Amir Oveissi — developer profile</title>
  <desc id="desc">Animated terminal identity banner showing Amir Oveissi, C sharp, .NET, React and TypeScript.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#dce6f3" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087f9c"/>
      <stop offset="1" stop-color="#6942b4"/>
    </linearGradient>
    <clipPath id="command-clip">
      <rect x="94" y="341" width="0" height="27">
        <animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.12;0.45;0.89;1" dur="5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1100" height="400" rx="18" fill="#f6f9ff"/>
  <rect width="1100" height="400" rx="18" fill="url(#grid)"/>
  <rect x="12" y="12" width="1076" height="376" rx="13" fill="none" stroke="#9cb8d2" stroke-width="2"/>
  <path d="M27 13H300" stroke="#087f9c" stroke-width="4"/>
  <path d="M805 388H1074" stroke="#6942b4" stroke-width="4"/>

  <circle cx="47" cy="43" r="5" fill="#ed7288"/>
  <circle cx="66" cy="43" r="5" fill="#eab963"/>
  <circle cx="85" cy="43" r="5" fill="#4ecaa5"/>
  <text x="114" y="49" fill="#536b88" font-family="Consolas,Cascadia Code,monospace" font-size="17">AMIR.OVEISSI / PROFILE</text>
  <circle cx="988" cy="42" r="5" fill="#087f9c">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1001" y="48" fill="#536b88" font-family="Consolas,Cascadia Code,monospace" font-size="14">ONLINE</text>
  <path d="M34 67H1066" stroke="#9cb8d2" stroke-width="1"/>

  <text x="47" y="157" fill="#14223e" font-family="Bahnschrift,Segoe UI,Arial,sans-serif" font-size="92" font-weight="700" letter-spacing="3">AMIR</text>
  <text x="46" y="246" fill="#087f9c" font-family="Bahnschrift,Segoe UI,Arial,sans-serif" font-size="88" font-weight="700" letter-spacing="1">OVEISSI</text>
  <path d="M48 265H490" stroke="url(#accent-line)" stroke-width="3"/>
  <text x="48" y="293" fill="#536b88" font-family="Consolas,Cascadia Code,monospace" font-size="16">SOFTWARE DEVELOPER</text>
  <text x="48" y="316" fill="#14223e" font-family="Consolas,Cascadia Code,monospace" font-size="16">C#  /  .NET 8 &amp; 10  /  REACT  /  TYPESCRIPT</text>

  <circle cx="829" cy="192" r="112" fill="#eaf1fc" stroke="#9cb8d2" stroke-width="2"/>
  <circle cx="829" cy="192" r="92" fill="none" stroke="#dce6f3" stroke-width="17"/>
  <circle cx="829" cy="192" r="93" fill="none" stroke="#6942b4" stroke-width="2" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" values="0;72" dur="9s" repeatCount="indefinite"/>
  </circle>
  <g>
    <circle cx="829" cy="80" r="8" fill="#087f9c"/>
    <path d="M829 68V57" stroke="#087f9c" stroke-width="2"/>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 829 192" to="360 829 192" dur="11s" repeatCount="indefinite"/>
  </g>
  <circle cx="829" cy="192" r="69" fill="#ffffff" stroke="#087f9c" stroke-width="2"/>
  <text x="762" y="216" fill="#14223e" font-family="Bahnschrift,Segoe UI,Arial,sans-serif" font-size="71" font-weight="700">AO</text>
  <text x="780" y="243" fill="#087f9c" font-family="Consolas,Cascadia Code,monospace" font-size="13">&lt;/&gt; DEV</text>
